<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1010px" version="1.1" viewBox="0 0 1440 1010" width="1440px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#0b1520" height="1010px" width="1440px" x="0" y="0" /><text fill="#edf7f5" font-family="Arial" font-size="34" font-weight="bold" x="55" y="66">ESP32 COMPUTER DIRECTORY   /   PROTOTYPE WIRING</text><text fill="#aac1d0" font-family="Arial" font-size="17" x="57" y="101">Module-level pin map • consistent with firmware • 3.3 V logic • not a routed PCB</text><rect fill="#152738" height="315px" rx="18" stroke="#456072" stroke-width="2" width="407px" x="60" y="142" /><rect fill="#53b6bc" height="9px" rx="4" width="407px" x="60" y="142" /><text fill="#53b6bc" font-family="Arial" font-size="23" font-weight="bold" x="82" y="187">ST7789V COLOR TFT</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="82" y="230">GPIO 23  →  DIN / MOSI</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="82" y="261">GPIO 18  →  CLK / SCK</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="82" y="292">GPIO 16  →  CS</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="82" y="323">GPIO 17  →  DC</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="82" y="354">GPIO 14  →  RST</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="82" y="385">3V3  →  VCC*   GND → GND</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="82" y="416">BL  →  VERIFY MODULE SPEC</text><rect fill="#152738" height="315px" rx="18" stroke="#456072" stroke-width="2" width="407px" x="518" y="142" /><rect fill="#c4a6e9" height="9px" rx="4" width="407px" x="518" y="142" /><text fill="#c4a6e9" font-family="Arial" font-size="23" font-weight="bold" x="540" y="187">microSD SPI BREAKOUT</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="540" y="230">GPIO 23  →  MOSI / DI</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="540" y="261">GPIO 18  →  SCK / CLK</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="540" y="292">GPIO 19  ←  MISO / DO</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="540" y="323">GPIO 13  →  CS</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="540" y="354">3V3  →  VCC*</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="540" y="385">GND  →  GND</text><rect fill="#152738" height="315px" rx="18" stroke="#456072" stroke-width="2" width="407px" x="975" y="142" /><rect fill="#e0b972" height="9px" rx="4" width="407px" x="975" y="142" /><text fill="#e0b972" font-family="Arial" font-size="23" font-weight="bold" x="997" y="187">1602 LCD + I2C</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="997" y="230">GPIO 21  ↔  SDA</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="997" y="261">GPIO 22  →  SCL</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="997" y="292">GND  →  GND</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="997" y="323">3V3  →  VCC ONLY IF SUPPORTED</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="997" y="354">5V BACKPACK: ADD I2C</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="997" y="385">LEVEL SHIFTER + 5V SUPPLY</text><rect fill="#152738" height="315px" rx="18" stroke="#456072" stroke-width="2" width="407px" x="60" y="504" /><rect fill="#82ce99" height="9px" rx="4" width="407px" x="60" y="504" /><text fill="#82ce99" font-family="Arial" font-size="23" font-weight="bold" x="82" y="549">JOYSTICK ANALOG</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="82" y="592">GPIO 34  ←  VRx</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="82" y="623">GPIO 35  ←  VRy</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="82" y="654">3V3  →  VCC</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="82" y="685">GND  →  GND</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="82" y="716">SW  →  NOT CONNECTED</text><rect fill="#152738" height="315px" rx="18" stroke="#456072" stroke-width="2" width="407px" x="518" y="504" /><rect fill="#e9a2ae" height="9px" rx="4" width="407px" x="518" y="504" /><text fill="#e9a2ae" font-family="Arial" font-size="23" font-weight="bold" x="540" y="549">4 SQUARE BUTTONS</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="540" y="592">POWER RED  →  GPIO 32</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="540" y="623">BACK YELLOW  →  GPIO 33</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="540" y="654">PRESS GREEN  →  GPIO 25</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="540" y="685">STOP BLUE  →  GPIO 26</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="540" y="716">Other terminal of each → GND</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="540" y="747">INPUT_PULLUP in firmware</text><rect fill="#152738" height="315px" rx="18" stroke="#456072" stroke-width="2" width="407px" x="975" y="504" /><rect fill="#7ec5e8" height="9px" rx="4" width="407px" x="975" y="504" /><text fill="#7ec5e8" font-family="Arial" font-size="23" font-weight="bold" x="997" y="549">PASSIVE PIEZO</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="997" y="592">GPIO 27  →  Piezo (+)</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="997" y="623">GND  →  Piezo (-)</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="997" y="654">Only small 3.3V-compatible piezo</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="997" y="685">Active / high-current buzzers:</text><text fill="#e2ecf3" font-family="DejaVu Sans Mono" font-size="17" x="997" y="716">ADD a suitable transistor driver.</text><text fill="#fcdf9b" font-family="Arial" font-size="19" x="58" y="885">Power: ESP32 via USB 5 V. Share GND. Do not connect 5 V signals to GPIO. Verify module pinouts before soldering.</text><text fill="#f7b6b6" font-family="Arial" font-size="17" x="58" y="923">POWER = deep sleep/wake (not true supply OFF). STOP = authenticated remote shutdown request (not a safety emergency stop).</text></svg>